name: bictc
description: "BICTC accessibility app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  image_picker: ^1.2.3
  latlong2: 0.9.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  licenses:
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-Nunito.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
